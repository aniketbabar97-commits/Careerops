name: Job Scan

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scanner
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scanner/scan.js

      - name: Commit updated report
        run: |
          git config user.name "job-scan-bot"
          git config user.email "actions@github.com"
          git add data/jobs.json reports/latest.md
          git diff --cached --quiet || git commit -m "chore: update job scan report"
          git push
